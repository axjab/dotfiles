discharging_symbol = '󰁼'
style = 'bold yellow'

[[battery.display]] # < 50%
threshold = 49
discharging_symbol = '󰁽'
style = 'dimmed yellow'

[[battery.display]] # < 60%
threshold = 59
discharging_symbol = '󰁾'
style = 'dimmed yellow'

[[battery.display]] # < 70%
threshold = 69
discharging_symbol = '󰁿'
style = 'dimmed yellow'

[[battery.display]] # < 80%
