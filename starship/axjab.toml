# ~/.config/starship.toml

# REFERENCE: https://starship.rs/config
# TODO:
# - Report connection errors: Internet, Tailscale, NATS, LoRa, etc.

# Two lines:
# First line: status indicators: tasks, remidners, failrue, jobs, git, etc.
# Second line: identity, filesystem, weather, and time

### SAMPLE ##########################################################                                                                    #
#  1 󰂚 1 [✎] +285 -34                          Python 3.14 KEY=val #
# server etc >>                                   󰖕 -> 󰙾  16:37:33 #
#####################################################################

"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
scan_timeout = 30
command_timeout = 500
palette = 'foo'
follow_symlinks = true

right_format = "${custom.weather} $time"
format = """
(\
  ($status )($jobs )($memory_usage )\
  ($cmd_duration )($netns )($nats )($custom )\
  ($git_status )($git_commit )($git_state )($git_metrics )\
  (\
    $direnv($python )$golang$nodejs$rust$env_var\
    $container$docker_container\
  )\
  \n\
)\
($battery )\
($username(@$hostname):)($git_branch )$directory \
(${env_var.prompt_break}\n)\
$shlvl$character
"""
# NOTE: 
# NOTE: $fill has been intentionally omitted because it
# causes ( $fill $emptyvar ) to ALWAYS render (as space)
# when it's the opposite of the desired effect
# logical context and device metrics
# brackets () control adjacent spacing based on existance

# ======================================================

# LOWER RIGHT
# ===========================
[time]
disabled = false
format = '[$time](bold green)'
time_format = '%T'
[custom.weather]
disabled = false
description = "[POC] Current weather and weather transitions"
when = true
command = 'echo "󰖕 -> 󰙾 "'
style = 'cyan'

# LOWER LEFT
# ===========================
[battery]
disabled = false
format = '[$symbol$percentage$battery]($style)'
full_symbol = '󰁹 '
charging_symbol = '󱐋' # ⚡️  󱐋 󰂄
# unknown_symbol = '?'
empty_symbol = '󰂎☠'
#discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
# empty_symbol = "󰂎 "
[username]
style_user = 'dimmed green'
style_root = 'bold green'
format = '[$user]($style)'
[hostname]
ssh_only = true
format = '[$hostname](green)'
ssh_symbol = '🌐'
[directory]
disabled = false
read_only = " 󰌾"
format = '[$path](bold blue)[$read_only]($read_only_style)'
truncation_length = 4
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)'
[git_branch]
disabled = false
format = '[$symbol$branch(:$remote_branch)]($style)'
style = 'purple'
symbol = ''
[shlvl]
disabled = false
format = '[$symbol]($style)'
repeat = true
symbol = '>'
repeat_offset = 1
threshold = 0
[character]
success_symbol = '[>](bold green)'
error_symbol = '[>](bold red)'

# UPPER RIGHT
# =============================
[fill]
symbol = ' '
style = 'dimmed white'
[direnv]
disabled = false
symbol = " "

# UPPER LEFT
# ==============================
[env_var.prompt_break]
description = "A flag raised to insert a line break just before the prompt character: export PROMPT_BREAK=true"
symbol = '󱞦 '
variable = 'PROMPT_BREAK'
format = '$symbol'
[status]
disabled = false
map_symbol = true
recognize_signal_code = true
format = '[$symbol](red)[${status}(/${signal_name})](bold red)'
symbol = ' ' 
sigint_symbol = '⚡'
[jobs]
symbol = ' '
format = '[$symbol](blue)[$number]($style)'
number_threshold = 1
[memory_usage]
disabled = false
threshold = 70
# symbol = '⚠RAM'
symbol = "󰍛 "
format = '[$symbol$ram/$ram_total($ram_pct)]($style)'
style = 'bold #ff9f1c'
[nats]
disabled = false
symbol = " "
# [custom.nats]
# disabled = false
# description = "Inbound NATS message indicator. Topics: whatsapp, email, ntfy, system, etc."
# when = '(( ${nats_msg:-0} > 0 ))'
# command = 'echo "$nats_msg"'
# symbol = '◈'
# format = '[$symbol$output](bold green)'
[git_status]
style = "bold yellow"
format = '([\[$all_status$ahead_behind\]]($style))'
modified = "✎"
staged = "[+](bold green)"
untracked = "[?](bold red)"
deleted = "[×](bold red)"
conflicted = "[⚔](bold red)"
ahead = "[⇡${count}](bold cyan)"
behind = "[⇣${count}](bold magenta)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold red)"
[git_metrics]
disabled = false
[git_state]
disabled = false
[git_commit]
disabled = false
tag_symbol = ' '
[cmd_duration]
disabled = false
min_time = 2000
format = '⏳[$duration]($style)'	# The format for the module.
style = 'yellow'
show_milliseconds = true # Shortest duration to show time for (in milliseconds).
show_notifications = false	# Show desktop notifications when command completes.

# CUSTOM SCRIPTS: https://github.com/starship/starship/discussions/1252?sort=top
# IDEA: TIMER, POMODORO, NEXT DEADLINE (calnedar integration)
[custom.status]
disabled = true
when = true #'[[ "$STARSHIP_CMD_STATUS" != "0" ]]'
command = 'subscript $STARSHIP_CMD_STATUS'
symbol = ''
format = '[$output]($style) '
style = 'red'

# Internet — only show when unavailable
[custom.internet]
disabled = true
description = "Internet unavailable"
when = '!(timeout 0.2 bash -c "</dev/tcp/1.1.1.1/443" 2>/dev/null)'
command = "true"
symbol = ' 󰖪 '
format = '[$symbol](bold red)'

# Tailnet — only show when disconnected
[custom.tailnet]
disabled = false
description = "Tailnet disconnected"
when = '[[ "$(tailscale status --json 2>/dev/null | jq -r ".BackendState // empty")" != "Running" ]]'
command = "true"
symbol = ' 󰖪 '
format = '[$symbol](bold red)'

# NATS — only show when unreachable
[custom.nats]
disabled = false
description = "NATS unavailable"
when = '!(timeout 0.2 bash -c "</dev/tcp/nats/4222" 2>/dev/null)'
command = "true"
symbol = ' 󰒋 '
format = '[$symbol](bold red)'

# GPG — only show when this machine has no secret key
[custom.gpg]
disabled = false
description = "No GPG secret key"
when = '[[ -z "$(gpg --list-secret-keys --with-colons 2>/dev/null)" ]]'
command = "true"
symbol = ' 󰌆 '
format = '[$symbol](bold red)'

# SSH identity — only show when the host identity is missing
[custom.ssh_identity]
disabled = false
description = "SSH host identity missing"
when = '[[ ! -f "$HOME/.ssh/$(hostname).key" ]]'
command = "true"
symbol = ' 󰣀 '
format = '[$symbol](bold red)'

[custom.timer]
disabled = true
description = "[POC] Countdown timer"
when = true
command = '''
remaining=$((30 - ($(date +%s) % 60)))
((remaining < 0)) && remaining=0
printf '󰔛 %02d' "$remaining"
'''
format = '[$output](yellow)'

[custom.todo]
disabled = true
description = "[POC] TODO count"
when = true
command = 'printf "󰄲 %s" "$(wc -l < "$HOME/todo.md")"'
format = '[$output](white)'

[custom.blink]
disabled = true
description = "[POC] Blink test"
when = true
command = 'echo "󰀠 BLINK"'
style = 'blink red'

[custom.belfry]
disabled = false
description = "Unacknowledged Belfry reminders"
when = '[[ "$(belfry 2>/dev/null | wc -l)" -gt 0 ]]'
command = 'belfry 2>/dev/null | wc -l'
symbol = '󰂚 '
format = '[$symbol](yellow)[$output](bold yellow)'

# [env_var]
# format = " [$env_value]($style)"
[env_var.TEST_ONE]
format = "  [$env_value]($style)"
[env_var.TEST_TWO]
format = "  [$env_value]($style)"

# BATTERY DETAILS ***********************************
[[battery.display]] # < 10%
threshold = 10
discharging_symbol = ' '
style = 'blink bold red'

[[battery.display]] # < 20%
threshold = 19
discharging_symbol = '󰁺'
style = 'blink bold red'

[[battery.display]] # < 30%
threshold = 29
discharging_symbol = '󰁻'
style = 'bold yellow'

[[battery.display]] # < 40%
threshold = 39
discharging_symbol = '󰁼'
style = 'bold yellow'

[[battery.display]] # < 50%
threshold = 49
discharging_symbol = '󰁽'
style = 'dimmed yellow'

[[battery.display]] # < 60%
threshold = 59
discharging_symbol = '󰁾'
style = 'dimmed yellow'

[[battery.display]] # < 70%
threshold = 69
discharging_symbol = '󰁿'
style = 'dimmed yellow'

[[battery.display]] # < 80%
threshold = 79
discharging_symbol = '󰂀'
style = 'dimmed green'

[[battery.display]] # < 90%
threshold = 89
discharging_symbol = '󰂁'
style = 'dimmed green'

[[battery.display]] # < 100%
threshold = 95
discharging_symbol = '󱈏 '
style = 'fg:#C37093'
