# ~/.config/starship.toml

# REFERENCE: https://starship.rs/config

"$schema" = 'https://starship.rs/config-schema.json'

# TODO:
# 1. Indicate ACTIVE SSH session
# 2. Report connection errors: Internet, Tailscale, NATS, LoRa, etc.
# 3. [in progress] NOTIFICATION COUNTER; new ntfy messages, new NATS messages, etc.
# 4. 

add_newline = false
scan_timeout = 30
command_timeout = 500
# palette = 'foo'  # defined last
# follow_symlinks

# logical context and device metrics
format = """
$cmd_duration\
$git_branch$git_commit$git_state\
$git_metrics\
$git_status\
$battery\
$jobs\
$sudo\
(\n${custom.messages})
$directory\
$shlvl\
$status\
$character
"""

# session and physical context, answers who? where? when?
right_format = "$username@$hostname$time"

# pinned

[time]
disabled = false
format = '[$time]($style)'
style = 'bold green'
time_format = '%T'

[username]
show_always = true
style_user = 'dimmed white'
style_root = 'white bold'
format = '[$user]($style)'

[hostname]
ssh_only = false
format = '[$hostname]($style) $ssh_symbol'
style = 'dimmed gray'
ssh_symbol = '[\[SSH ACTIVE\] ](bold blue)'  # failed to get symbol in other part of prompt

[character]
success_symbol = '[>](bold green)'
error_symbol = '[>](bold red)'

# ---------------------

# pointless ?
[nats]
disabled = false
# name = 'notifications'  # nats context ls
format = '[$symbol]($style)'
style = 'bold purple'

# CUSTOM SCRIPTS: https://github.com/starship/starship/discussions/1252?sort=top
# IDEA: TIMER, POMODORO, NEXT DEADLINE (calnedar integration)
  [custom.messages]
  disabled = false
  description = "Inbound NATS message indicator. Topics: whatsapp, email, ntfy, system, etc."
  when = '(( ${nats_msg:-0} > 0 ))'
  command = 'echo "$nats_msg"'
  symbol = '◈'
  format = '[$symbol$output](bold green)'
  # warning: ⚠

