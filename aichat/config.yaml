# ---- llm ----

# Set default temperature parameter (0, 1)
# <= 0.2 is suitable for uncreative, highly technical concepts
temperature: 0.2
 # Set default top-p parameter, with a range of (0, 1) or (0, 2) depending on the model
top_p: null

# ---- behavior ----

stream: true                     # Controls whether to use the stream-style API.
save: true                       # Indicates whether to persist the message
keybindings: emacs               # Choose keybinding style (emacs, vi)
editor: micro                    # Specifies the command used to edit input buffer or session. (e.g. vim, emacs, nano).
wrap: auto                       # Controls text wrapping (no, auto, <max-width>)
wrap_code: false                 # Enables or disables wrapping of code blocks

# ---- RAG ----
# See [RAG-Guide](https://github.com/sigoden/aichat/wiki/RAG-Guide) for more details.
# Defines the query structure using variables like __CONTEXT__ and __INPUT__ to tailor searches to specific needs
# rag_template: |
#   Answer the query based on the context while respecting the rules. (user query, some textual context and rules, all inside xml tags)
# 
#   <context>
#   __CONTEXT__
#   </context>
# 
#   <rules>
#   - If you don't know, just say so.
#   - If you are not sure, ask for clarification.
#   - Answer in the same language as the user query.
#   - If the context appears unreadable or of poor quality, tell the user then answer as best as you can.
#   - If the answer is not in the context but you think you know the answer, explain that to the user then answer with your own knowledge.
#   - Answer directly and without using xml tags.
#   </rules>
# 
#   <user_query>
#   __INPUT__
#   </user_query>

# ---- function-calling ----

# Visit https://github.com/sigoden/llm-functions for setup instructions
function_calling: true           # Enables or disables function calling (Globally).
mapping_tools:                   # Alias for a tool or toolset
  fs: 'fs_cat,fs_ls,fs_mkdir,fs_rm,fs_write'
use_tools: null                  # Which tools to use by default. (e.g. 'fs,web_search')

# ---- clients ----

# model: groq:openai/gpt-oss-120b    # FUCKING BROKEN Best for speed and brevity
model: cerebras:gpt-oss-120b         # Alternative to broken Groq
# model: openrouter:openrouter/free  # fallback

clients:

  - type: openai-compatible
    name: cerebras
    api_base: https://api.cerebras.ai/v1
    api_key: {{ getpw "llm/cerebras" }}
    models:
      - name: gpt-oss-120b
        max_input_tokens: 8192
      - name: gpt-oss-20b
        max_input_tokens: 8192

  - type: openai-compatible
    name: groq
    api_base: https://api.groq.com/openai/v1
    api_key: {{ getpw "llm/groq" }}
    models:
      - name: openai/gpt-oss-120b
        max_input_tokens: 131072
      - name: openai/gpt-oss-20b
        max_input_tokens: 131072
      - name: meta-llama/llama-4-scout-17b-16e-instruct
        max_input_tokens: 131072
        supports_vision: true

  - type: openai-compatible
    name: openrouter
    api_base: https://openrouter.ai/api/v1
    api_key: {{ getpw "llm/openrouter" }}

  # - type: openai
  #     api_base: https://api.openai.com/v1               # Optional
  #     api_key: xxx
  #     organization_id: org-xxx

  - type: gemini
    api_key: {{ getpw "llm/gemini" }}

  # BROKEN
  - type: openai-compatible
    name: moonshot
    api_base: https://api.moonshot.ai
    api_key: {{ getpw "llm/kimi" }}
    models:
      - name: kimi-k2-6
        max_input_tokens: 256000
        supports_vision: true
        supports_function_calling: true

  # UNTESTED
  - type: openai-compatible
    name: deepseek
    api_base: https://api.deepseek.com
    api_key: {{ getpw "llm/deepseek" }}
    models:
      - name: deepseek-chat
        max_input_tokens: 64000
      - name: deepseek-reasoner
        max_input_tokens: 64000

  # UNTESTED
  - type: claude
    api_key: {{ getpw "llm/claude" }}
